services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: company-rag-postgres
    environment:
      POSTGRES_DB: company_rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "5432:5432"
    volumes:
      - company-rag-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d company_rag"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  company-rag-postgres-data:
