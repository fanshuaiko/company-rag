spring:
  application:
    name: company-rag
  ai:
    model:
      chat: deepseek
      embedding: openai
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        model: ${DEEPSEEK_CHAT_MODEL:deepseek-chat}
        temperature: 0.2
    openai:
      api-key: ${EMBEDDING_API_KEY}
      embedding:
        model: ${EMBEDDING_MODEL:text-embedding-3-small}
        dimensions: ${EMBEDDING_DIMENSIONS:1536}
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: ${EMBEDDING_DIMENSIONS:1536}
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 1000
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/company_rag}
    username: ${DATABASE_USERNAME:rag}
    password: ${DATABASE_PASSWORD:rag}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
server:
  port: ${SERVER_PORT:8080}

rag:
  retrieval:
    top-k: 5
    similarity-threshold: 0.25
  ingestion:
    chunk-size: 800
    min-chunk-size-chars: 200
    min-chunk-length-to-embed: 10
    max-file-size-bytes: 20971520
